name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK · type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install
        working-directory: sdk
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build
        working-directory: sdk
        run: npm run build

  api:
    name: API · type-check
    runs-on: ubuntu-latest
    needs: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install SDK deps (sibling import)
        working-directory: sdk
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Install API deps
        working-directory: api
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Type-check API
        working-directory: api
        run: npx tsc --noEmit

  app:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build
        working-directory: app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  mcp:
    name: MCP server · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: mcp
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build
        working-directory: mcp
        run: npm run build

  elizaos-plugin:
    name: elizaOS plugin · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: elizaos-plugin
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build
        working-directory: elizaos-plugin
        run: npm run build
